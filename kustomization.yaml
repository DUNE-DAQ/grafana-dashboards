# Global options
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
commonAnnotations:
  grafana_folder: "DUNE"
#namespace: monitoring


# Generate a ConfigMap for each dashboard
# for i in `ls`; do echo -n '- name: dune-daq-'; echo $(echo $i | cut -d'.' -f1 | tr '_' '-'); echo "  files: [ dashboards/${i} ]"; done
configMapGenerator:
- name: dune-daq-applications
  files: [ dashboards/applications.json ]
- name: dune-daq-CTB
